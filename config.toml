# typst-writer configuration. No secrets here: the Anthropic API key comes from
# the ANTHROPIC_API_KEY environment variable or the OS keyring only.

[server]
# The backend always binds to 127.0.0.1; only the ports are configurable.
backend_port = 8000
frontend_port = 5173

[typst]
# Must match the typst-py pin in backend/pyproject.toml.
version = "0.15.0"

[timing]
doc_changed_debounce_ms = 300
typing_paused_ms = 1500

[limits]
max_ws_message_bytes = 2_000_000
max_ai_text_chars = 20_000

[claude]
# Models offered in the AI selector's Claude slot. Claude runs through the locally installed
# and logged-in `claude` command (Claude Code), so these are its --model values: aliases
# such as "sonnet" always mean the latest model of that family; full model names work too.
models = ["sonnet", "opus", "haiku"]
# A review is cancelled (and the claude process stopped) after this many seconds.
timeout_seconds = 120

[ollama]
base_url = "http://127.0.0.1:11434"
