# typst-writer configuration. No secrets here: Claude runs through the logged-in
# `claude` command, and no API keys are used.

[server]
# The backend always binds to 127.0.0.1; only the ports are configurable.
backend_port = 8000
frontend_port = 5173

[typst]
# Must match the typst-py pin in backend/pyproject.toml.
version = "0.15.0"

[timing]
doc_changed_debounce_ms = 300
typing_paused_ms = 1500

[limits]
max_ws_message_bytes = 2_000_000
max_ai_text_chars = 20_000
# Longer files are not grammar-checked (LTeX+ gets slow on very long documents).
max_check_chars = 200_000
# Largest single message accepted from a language server (LTeX+).
max_lsp_message_bytes = 20_000_000

[claude]
# Models offered in the AI selector's Claude slot. Claude runs through the locally installed
# and logged-in `claude` command (Claude Code), so these are its --model values: aliases
# such as "sonnet" always mean the latest model of that family; full model names work too.
models = ["sonnet", "opus", "haiku"]
# A review is cancelled (and the claude process stopped) after this many seconds.
timeout_seconds = 120

[ollama]
# The local AI slot (live check while writing). Must point at this computer: the app refuses
# to start with any other host, so text sent to the "local" model never leaves the machine.
base_url = "http://127.0.0.1:11434"
# A paragraph check is abandoned after this many seconds (the first one loads the model).
timeout_seconds = 60
# Longer paragraphs are not sent to the local model.
max_paragraph_chars = 4000

[ltex]
# LTeX+ (spelling and grammar, offline). Downloaded once on request ("Install" in the status
# bar or `python scripts/install_ltex.py`) into the app's cache folder; each archive bundles
# its own Java, and is only unpacked when its SHA-256 matches the value below.
version = "18.7.0"
url = "https://github.com/ltex-plus/ltex-ls-plus/releases/download/{version}/ltex-ls-plus-{version}-{platform}.{extension}"
startup_timeout_seconds = 180
check_timeout_seconds = 30

[ltex.sha256]
windows-x64 = "24819298d9fd0130a4375030bcc6a7ada83d06ced453f524331de688904323ec"
linux-x64 = "1e16df6c578dc76ff97d644445d126ba6fba5c2e8e174178ab86372652fd7612"
mac-aarch64 = "2255eadb7be3b58b93d17efcd6fb10809e40e2b28289fdb1af966a874dac13e4"
mac-x64 = "90cf632a89604172b8170701bd04745dc73de4ac48d2eb4ced879bed532eaa4f"
